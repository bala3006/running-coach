[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "running-coach"
version = "0.1.0"
description = "A local-first running coach powered by Ollama and MCP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "mcp[cli]>=2.0,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
running_coach = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
